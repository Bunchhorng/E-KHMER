name: ekhmer-production

x-app: &app
  image: ekhmer-app:production
  build:
    context: .
    dockerfile: docker/production/Dockerfile
    target: app
  environment:
    APP_NAME: ${APP_NAME:-E-KHMER}
    APP_KEY: ${APP_KEY:-}
    APP_ENV: production
    APP_DEBUG: "false"
    APP_URL: ${APP_URL:?Set APP_URL}
    FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL}
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: ${MYSQL_DATABASE:-ecommerce}
    DB_USERNAME: ${MYSQL_USER:-ecommerce}
    DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
    REDIS_HOST: redis
    CACHE_STORE: redis
    SESSION_DRIVER: redis
    QUEUE_CONNECTION: redis
    QUEUE_AFTER_COMMIT: "true"
    SESSION_SECURE_COOKIE: "true"
    SANCTUM_TOKEN_EXPIRATION_MINUTES: ${SANCTUM_TOKEN_EXPIRATION_MINUTES:-1440}
    PAYMENT_MODE: production
    BAKONG_API_URL: ${BAKONG_API_URL:-https://api-bakong.nbc.gov.kh}
    BAKONG_API_TOKEN: ${BAKONG_API_TOKEN:-}
    ORDER_RESERVATION_MINUTES: ${ORDER_RESERVATION_MINUTES:-15}
    ORDER_RETURN_DAYS: ${ORDER_RETURN_DAYS:-14}
    MAIL_MAILER: ${MAIL_MAILER:-smtp}
    MAIL_HOST: ${MAIL_HOST:-}
    MAIL_PORT: ${MAIL_PORT:-587}
    MAIL_USERNAME: ${MAIL_USERNAME:-}
    MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    MAIL_SCHEME: ${MAIL_SCHEME:-smtp}
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
    MAIL_FROM_NAME: ${MAIL_FROM_NAME:-E-KHMER}
    LOG_CHANNEL: stderr
  restart: unless-stopped
  volumes:
    - public_media:/var/www/storage/app/public
    - private_media:/var/www/storage/app/private
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
services:
  app:
    <<: *app
  worker:
    <<: *app
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90 --max-time=3600
    stop_grace_period: 100s
  scheduler:
    <<: *app
    command: php artisan schedule:work
  web:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
      target: web
    restart: unless-stopped
    volumes:
      - public_media:/var/www/storage/app/public:ro
    depends_on: [app]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/up"]
      interval: 30s
      timeout: 10s
      retries: 3
  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./docker/production/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecommerce}
      MYSQL_USER: ${MYSQL_USER:-ecommerce}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --user=$$MYSQL_USER --database=$$MYSQL_DATABASE --execute='SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
  redis:
    image: redis:alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  backup:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecommerce}
      MYSQL_USER: ${MYSQL_USER:-ecommerce}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
    volumes:
      - ./docker/production/backup.sh:/opt/backup.sh:ro
      - public_media:/media/public:ro
      - private_media:/media/private:ro
      - backups:/backups
    command: ["sh", "-ec", "while true; do sh /opt/backup.sh; sleep 86400; done"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /backups/latest && test -n \"$$(find /backups -maxdepth 1 -name latest -mmin -1500 -print)\""]
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 10m
    depends_on:
      mysql:
        condition: service_healthy
  restore-db:
    image: mysql:8.0
    profiles: [maintenance]
    environment:
      MYSQL_ROOT_PASSWORD: restore-check-local-only
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -uroot --execute='SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
  restore-check:
    image: mysql:8.0
    profiles: [maintenance]
    environment:
      RESTORE_HOST: restore-db
      RESTORE_USER: root
      RESTORE_PASSWORD: restore-check-local-only
      RESTORE_DATABASE: ecommerce_restore_check
    volumes:
      - ./docker/production/restore-check.sh:/opt/restore-check.sh:ro
      - backups:/backups:ro
    tmpfs: [/tmp]
    entrypoint: [sh, /opt/restore-check.sh]
    depends_on:
      restore-db:
        condition: service_healthy
volumes:
  mysql_data:
  redis_data:
  public_media:
  private_media:
  backups:
  caddy_data:
  caddy_config:

