name: Application checks
on:
  pull_request:
  push:
    branches: [main, develop, dev]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare local environment
        run: cp backend/.env.example backend/.env
      - name: Start development services
        run: docker compose up -d --build mysql redis app frontend
      - name: Install backend dependencies
        run: docker compose exec -T app composer install --no-interaction --prefer-dist
      - name: Backend tests
        run: |
          docker compose exec -T app php artisan key:generate --no-interaction
          docker compose exec -T app php artisan test --compact
      - name: Frontend production build
        run: docker compose exec -T frontend npm run build
      - name: Browser tests
        run: docker compose --profile test run --rm browser-tests
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=80
      - name: Stop services
        if: always()
        run: docker compose down

  dependency-security:
    name: Dependency Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start audit containers
        run: docker compose up -d --build app frontend
      - name: Clean frontend install
        run: docker compose exec -T frontend npm ci
      - name: Audit production npm dependencies
        run: docker compose exec -T frontend npm audit --omit=dev --audit-level=moderate --package-lock-only
      - name: Clean backend install
        run: docker compose exec -T app composer install --no-interaction --prefer-dist --no-progress
      - name: Check PHP platform requirements
        run: docker compose exec -T app composer check-platform-reqs
      - name: Audit production Composer dependencies
        run: docker compose exec -T app composer audit --no-dev
      - name: Stop audit services
        if: always()
        run: docker compose down -v --remove-orphans

