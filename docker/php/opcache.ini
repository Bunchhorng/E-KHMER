; Performance: enable OPcache in the PHP-FPM container.
; validate_timestamps=1 keeps development safe (file changes are picked up),
; while still eliminating per-request re-compilation of the entire framework.
;
; revalidate_freq is the single most important value in this file on Docker
; Desktop. /var/www is a Windows 9p bind mount, where a single stat() costs
; roughly 2.5 ms. At the old revalidate_freq=2, OPcache re-stat'ed all ~1100
; cached scripts every couple of seconds, which dominated total response time:
;
;   revalidate_freq=2   /api/catalog/facets  p50 4908 ms
;   revalidate_freq=60  /api/catalog/facets  p50  318 ms   (~15x faster)
;   validate_timestamps=0 /api/catalog/facets p50 393 ms  (no faster, and it
;                                                    breaks hot reload)
;
; 60s revalidation was measured to be as good as disabling validation, so it
; keeps code changes working while removing the cost. If you edit PHP and do
; not want to wait, force an immediate reload with:
;
;   docker compose exec app kill -USR2 1
;
; For a production deployment, mount an ini that sets validate_timestamps=0
; after this file (it must sort later in conf.d to win).
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=12000
opcache.max_wasted_percentage=5
opcache.validate_timestamps=1
opcache.revalidate_freq=60
opcache.fast_shutdown=1
