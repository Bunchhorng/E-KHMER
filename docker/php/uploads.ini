; Upload limits for admin media (product gallery, brand logo, category image).
;
; AdminImageUploadRequest rejects anything over 5 MB with a field-level 422, so
; these ceilings sit above that on purpose: PHP must be able to receive the file
; in order to produce the friendly error message instead of letting the request
; die with an opaque "post_max_size" warning.
;
; client_max_body_size in docker/nginx/default.conf is kept in step with
; post_max_size below. If nginx is left lower it rejects the upload first with a
; 413 HTML page that the SPA cannot explain to the admin.

upload_max_filesize = 8M
post_max_size = 12M
max_file_uploads = 20