server {

    listen 80;

    server_name localhost;

    root /var/www/public;

    index index.php index.html;

    charset utf-8;

    # nginx defaults to 1m, which rejects ordinary product/category photos with
    # a bare 413 before PHP ever sees them. Keep this at or above post_max_size
    # in docker/php/uploads.ini so the app, not the proxy, owns the limit and can
    # answer with a readable validation error.
    client_max_body_size 12m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/css
        text/plain
        text/javascript
        application/javascript
        application/json
        application/vnd.ms-excel
        application/pdf
        image/svg+xml
        application/xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location ~ \.php$ {

        fastcgi_pass app:9000;

        fastcgi_index index.php;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}