services:

  # ==========================================
  # Laravel PHP
  # ==========================================
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: ecommerce_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
      - ./docker/php/opcache.ini:/usr/local/etc/php/conf.d/zz-opcache.ini:ro
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/zz-uploads.ini:ro
    depends_on:
      - mysql
      - redis
    networks:
      - ecommerce

  # ==========================================
  # Laravel Scheduler (php artisan schedule:work)
  # ==========================================
  scheduler:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: ecommerce_scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan schedule:work
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
      - ./docker/php/opcache.ini:/usr/local/etc/php/conf.d/zz-opcache.ini:ro
    depends_on:
      - mysql
      - redis
    networks:
      - ecommerce

  worker:
    image: ${COMPOSE_PROJECT_NAME:-e-ecommerce}-app
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90 --max-time=3600
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
    depends_on:
      - mysql
      - redis
    networks:
      - ecommerce

  # ==========================================
  # Nginx
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: ecommerce_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - ecommerce

  # ==========================================
  # MySQL
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: ecommerce_mysql
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: ecommerce_db
      MYSQL_USER: ecommerce_user
      MYSQL_PASSWORD: ecommerce_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ecommerce

  # ==========================================
  # Redis
  # ==========================================
  redis:
    image: redis:alpine
    container_name: ecommerce_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ecommerce

  # ==========================================
  # phpMyAdmin
  # ==========================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ecommerce_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root_password
    depends_on:
      - mysql
    networks:
      - ecommerce

  # ==========================================
  # Vue Frontend
  # ==========================================
  frontend:
    image: node:22-alpine
    container_name: ecommerce_frontend
    working_dir: /app
    ports:
      - "5174:5173"
    environment:
      # Proxy /api calls to the nginx container (backend) on the internal network.
      # localhost:8000 would point to the frontend container itself and fail.
      VITE_PROXY_TARGET: http://nginx
      # Windows bind mounts need polling for Vite to see source edits reliably.
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - ecommerce

  browser-tests:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    profiles: [test]
    init: true
    working_dir: /app
    shm_size: 1gb
    environment:
      PLAYWRIGHT_BASE_URL: http://localhost:5173
      CI: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npx playwright test
    depends_on:
      - frontend
    network_mode: service:frontend

  restore-db:
    image: mysql:8.0
    profiles: [maintenance]
    environment:
      MYSQL_ROOT_PASSWORD: restore-check-local-only
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -uroot --execute='SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - ecommerce

  backup-check:
    image: mysql:8.0
    profiles: [maintenance]
    environment:
      MYSQL_DATABASE: ecommerce_db
      MYSQL_USER: ecommerce_user
      MYSQL_PASSWORD: ecommerce_password
      RESTORE_HOST: restore-db
      RESTORE_USER: root
      RESTORE_PASSWORD: restore-check-local-only
      RESTORE_DATABASE: ecommerce_restore_check
    entrypoint: ["sh", "-ec"]
    command: ["sh /opt/backup.sh && sh /opt/restore-check.sh"]
    tmpfs:
      - /backups
    volumes:
      - ./docker/production/backup.sh:/opt/backup.sh:ro
      - ./docker/production/restore-check.sh:/opt/restore-check.sh:ro
      - ./backend/storage/app/public:/media/public:ro
      - ./backend/storage/app/private:/media/private:ro
    depends_on:
      restore-db:
        condition: service_healthy
    networks:
      - ecommerce

networks:
  ecommerce:
    driver: bridge

volumes:
  backend_vendor:
  mysql_data:
  redis_data:
  frontend_node_modules:
