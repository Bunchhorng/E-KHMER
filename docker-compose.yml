services:

  # ==========================================
  # Laravel PHP
  # ==========================================
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: ecommerce_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - ./docker/php/opcache.ini:/usr/local/etc/php/conf.d/zz-opcache.ini:ro
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/zz-uploads.ini:ro
    depends_on:
      - mysql
      - redis
    networks:
      - ecommerce

  # ==========================================
  # Laravel Scheduler (php artisan schedule:work)
  # ==========================================
  scheduler:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: ecommerce_scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan schedule:work
    volumes:
      - ./backend:/var/www
      - ./docker/php/opcache.ini:/usr/local/etc/php/conf.d/zz-opcache.ini:ro
    depends_on:
      - mysql
      - redis
    networks:
      - ecommerce

  # ==========================================
  # Nginx
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: ecommerce_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - ecommerce

  # ==========================================
  # MySQL
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: ecommerce_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ecommerce_db
      MYSQL_USER: ecommerce_user
      MYSQL_PASSWORD: ecommerce_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ecommerce

  # ==========================================
  # Redis
  # ==========================================
  redis:
    image: redis:alpine
    container_name: ecommerce_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ecommerce

  # ==========================================
  # phpMyAdmin
  # ==========================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ecommerce_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root_password
    depends_on:
      - mysql
    networks:
      - ecommerce

  # ==========================================
  # Vue Frontend
  # ==========================================
  frontend:
    image: node:22-alpine
    container_name: ecommerce_frontend
    working_dir: /app
    ports:
      - "5174:5173"
    environment:
      # Proxy /api calls to the nginx container (backend) on the internal network.
      # localhost:8000 would point to the frontend container itself and fail.
      VITE_PROXY_TARGET: http://nginx
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - ecommerce

networks:
  ecommerce:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  frontend_node_modules: